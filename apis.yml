name: Zetwerk
description: 'Zetwerk is a global contract-manufacturing and B2B supply-chain company that connects
  original equipment manufacturers with a vetted network of manufacturing partners across processes
  including CNC machining, die casting, forging, injection molding, and sheet-metal stamping. It serves
  industries such as aerospace and defense, automotive, consumer electronics, renewable energy, and
  industrial equipment, offering production sourcing, quoting, and program management. Backed by Accel,
  D1 Capital, Khosla Ventures, and Lightspeed Venture Partners, Zetwerk operates as a manufacturing
  services marketplace rather than a developer platform: as of this enrichment pass it publishes no
  public API, developer portal, SDKs, or programmatic integration surface.'
